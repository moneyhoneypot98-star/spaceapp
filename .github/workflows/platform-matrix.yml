name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Keyed per matrix leg so a queued macOS job is never cancelled while it waits for a
    # runner (arm64 acquisition regularly takes 15+ minutes; the fast legs keep their cancel).
    concurrency:
      group: platform-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.node }}
      cancel-in-progress: ${{ !startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman-rootless:
    name: Launcher / rootless Podman / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm

      # Podman 4.9.3 on Ubuntu 24.04; docker-compose v2 >= 2.20 is the supported compose provider.
      - name: Install rootless Podman and the compose provider
        run: sudo apt-get update && sudo apt-get install -y podman docker-compose-v2

      - name: Allow subordinate ids and delegate cgroup controllers
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegation.conf
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$USER"

      - name: Point `podman compose` at the docker-compose v2 provider
        run: |
          mkdir -p "$HOME/.config/containers"
          cat > "$HOME/.config/containers/containers.conf" <<'EOF'
          [engine]
          compose_providers=["/usr/libexec/docker/cli-plugins/docker-compose"]
          EOF

      - name: Start the rootless Podman API socket
        run: |
          systemctl --user enable --now podman.socket
          systemctl --user status --no-pager podman.socket
          timeout 30 bash -c 'until [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ]; do sleep 1; done'

      - name: Install workspace dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      - name: Install the small profile on rootless Podman
        run: |
          node packages/run-spaceapp/bin/spaceapp.mjs install --engine podman --profile small --non-interactive --answers '{"confirm":true,"profile":"small","access":"isolated","companions":false,"telemetry":false,"open":false}'

      - name: Wait for readiness on 127.0.0.1:4911
        run: |
          timeout 600 bash -c 'until curl -fsS http://127.0.0.1:4911/readyz; do sleep 10; done'
          curl -fsS http://127.0.0.1:4911/readyz && echo "readyz ok"

      - name: Doctor on rootless Podman
        run: node packages/run-spaceapp/bin/spaceapp.mjs doctor

      - name: Backup
        run: node packages/run-spaceapp/bin/spaceapp.mjs backup

      - name: Uninstall and purge data
        run: node packages/run-spaceapp/bin/spaceapp.mjs uninstall --purge-data --non-interactive --answers '{"confirm":true,"purgeConfirm":"DELETE"}'

      - name: Assert nothing is left running
        run: |
          test -z "$(podman ps -q)" || { podman ps -a; exit 1; }
          test -z "$(podman volume ls -q)" || { podman volume ls; exit 1; }
